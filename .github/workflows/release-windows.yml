name: Build Windows

# Windows installers can't be built on macOS — the MSVC toolchain and the NSIS
# bundler are Windows-only — so a runner does it.
#
#   • Manual run  → installer lands as a downloadable artifact
#   • Tag v0.0.2  → installer is also attached to a draft GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        # tauri.conf.json runs `bun run build` before bundling.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Build the installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          # Only publish a Release when a tag triggered the run.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('RiseByDay {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: true

      - name: Upload installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiseByDay-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
